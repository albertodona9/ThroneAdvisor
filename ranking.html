<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ThroneAdvisor</title>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <header class="bg-white border-b shadow-sm">
      <div class="max-w-6xl mx-auto px-4 py-4 flex items-center gap-4">
        <a
          href="index.html"
          class="text-sm text-gray-600 hover:underline whitespace-nowrap"
          >← Back to Map</a
        >
        <div class="flex-1">
          <h1 class="text-xl sm:text-2xl font-bold text-red-600">
            ThroneAdvisor
          </h1>
          <div class="text-sm text-gray-500">
            Best to worst spots on DTU campus
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
      <div id="list" class="space-y-4"></div>

      <div class="mt-8 bg-white rounded-lg shadow p-4 md:p-6">
        <h3 class="font-semibold text-lg">Campus Statistics</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4 text-center">
          <div>
            <div class="text-2xl font-bold text-red-500" id="stat-toilets">
              0
            </div>
            <div class="text-sm text-gray-500">Total Toilets</div>
          </div>
          <div>
            <div class="text-2xl font-bold text-blue-500" id="stat-reviews">
              0
            </div>
            <div class="text-sm text-gray-500">Total Reviews</div>
          </div>
          <div>
            <div class="text-2xl font-bold text-yellow-500" id="stat-avg">
              0.0
            </div>
            <div class="text-sm text-gray-500">Average Rating</div>
          </div>
        </div>
      </div>
    </main>

    <script>
      async function loadRanking() {
        const res = await fetch("/api/ranking");
        const data = await res.json();
        const list = document.getElementById("list");
        if (!data || data.length === 0) {
          list.innerHTML = '<p class="text-gray-600">No toilets yet.</p>';
          return;
        }
        let totalReviews = 0;
        let totalToilets = data.length;
        let sumScore = 0;
        const rows = data
          .map((t, idx) => {
            const avg = Number(t.avg_score || 0).toFixed(2);
            totalReviews += Number(t.reviews || 0);
            sumScore += Number(t.avg_score || 0) * Number(t.reviews || 0);
            return `
            <div class="bg-white rounded-lg shadow p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
              <div class="flex-1">
                <div class="text-sm text-gray-500">Building ${
                  t.buildingName || "Unknown"
                }, Floor ${t.floorName || "Unknown"}</div>
                <div class="text-xs text-gray-400">${t.titleNumber || ""}</div>
              </div>
              <div class="text-right">
                <div class="inline-flex items-center gap-2">
                  <div class="text-sm text-green-600 font-bold px-2 py-1 rounded bg-green-50">${avg}/3</div>
                  <div class="text-xl">${"💩".repeat(
                    Math.round(Number(avg))
                  )}</div>
                </div>
                <div class="text-sm text-gray-500 mt-2">${
                  t.reviews || 0
                } reviews</div>
              </div>
            </div>
          `;
          })
          .join("");
        list.innerHTML = rows;
        document.getElementById("stat-toilets").textContent = totalToilets;
        document.getElementById("stat-reviews").textContent = totalReviews;
        const overall = totalReviews ? sumScore / totalReviews : 0;
        document.getElementById("stat-avg").textContent = overall.toFixed(1);
      }
      loadRanking();
    </script>
  </body>
</html>
